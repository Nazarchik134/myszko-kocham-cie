<!doctype html><html lang="pl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>❤️</title><style>*{box-sizing:border-box}html,body{height:100%;margin:0}body{display:grid;place-items:center;overflow:hidden;background:radial-gradient(circle at 20% 20%,#ffd6ec 0,#ff9dcb 28%,#e85a9d 65%,#9d245f 100%);font-family:Arial,sans-serif;color:white}body:before,body:after{content:'♥';position:absolute;font-size:150px;opacity:.12;filter:blur(1px);animation:float 7s ease-in-out infinite}body:after{font-size:90px;right:10%;top:15%;animation-delay:-3s}.card{position:relative;padding:55px 70px;border:1px solid #ffffff55;border-radius:35px;background:#ffffff22;backdrop-filter:blur(12px);box-shadow:0 25px 70px #6e164855;text-align:center}h1{margin:0;font-size:clamp(45px,9vw,95px);font-weight:800;letter-spacing:2px;text-shadow:0 5px 25px #8c164f99;animation:pulse 2.5s ease-in-out infinite}p{margin:18px 0 0;font-size:25px;opacity:.9;letter-spacing:3px}.heart{font-size:65px;margin-top:20px;animation:pulse 2.5s ease-in-out infinite}@keyframes pulse{50%{transform:scale(1.06)}}@keyframes float{50%{transform:translateY(-25px) rotate(8deg)}}</style><div class="card"><h1>myszko kocham cie</h1><p>♡ na zawsze ♡</p><div class="heart">❤️</div></div></html>
